<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="24/7 Breakdown Recovery Manchester. 24-minute response. Call 0161 000 0000.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="redfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Diagonal hazard stripes accent -->
  <g opacity="0.08">
    <rect x="-100" y="-100" width="60" height="900" transform="rotate(-25 600 315)" fill="#facc15"/>
    <rect x="0"    y="-100" width="60" height="900" transform="rotate(-25 600 315)" fill="#facc15"/>
    <rect x="100"  y="-100" width="60" height="900" transform="rotate(-25 600 315)" fill="#facc15"/>
  </g>

  <!-- Red sidebar accent -->
  <rect x="0" y="0" width="20" height="630" fill="#dc2626"/>
  <rect x="0" y="0" width="600" height="630" fill="url(#redfade)" opacity="0.18"/>

  <!-- Top urgency bar -->
  <rect x="0" y="0" width="1200" height="56" fill="#dc2626"/>
  <text x="80" y="36" font-family="Arial Black, sans-serif" font-weight="900" font-size="20" fill="#ffffff" letter-spacing="3">FAST DISPATCH IN MANCHESTER  ·  7 VEHICLES AVAILABLE NOW</text>

  <!-- Main headline -->
  <g font-family="Arial Black, Helvetica, sans-serif" font-weight="900">
    <text x="80" y="220" font-size="32" fill="#dc2626" letter-spacing="6">STUCK ON THE ROAD?</text>
    <text x="80" y="320" font-size="100" fill="#ffffff" letter-spacing="-2">BREAKDOWN</text>
    <text x="80" y="420" font-size="100" fill="#ffffff" letter-spacing="-2">RECOVERY</text>
    <text x="80" y="520" font-size="100" fill="#dc2626" letter-spacing="-2">MANCHESTER.</text>
  </g>

  <!-- Right side stats card -->
  <g transform="translate(840, 180)">
    <rect x="0" y="0" width="280" height="280" fill="#0a0a0a" stroke="#dc2626" stroke-width="6"/>
    <rect x="12" y="12" width="280" height="280" fill="none" stroke="#dc2626" stroke-width="2" opacity="0.3"/>

    <text x="140" y="56" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="14" fill="#dc2626" letter-spacing="4">AVG RESPONSE</text>
    <text x="140" y="140" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="100" fill="#facc15">24</text>
    <text x="140" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#737373">MINUTES</text>

    <line x1="40" y1="195" x2="240" y2="195" stroke="#262626" stroke-width="2"/>

    <text x="140" y="226" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="12" fill="#dc2626" letter-spacing="3">CALL NOW</text>
    <text x="140" y="262" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="22" fill="#ffffff" letter-spacing="1">0161 000 0000</text>
  </g>

  <!-- Bottom byline -->
  <rect x="0" y="586" width="1200" height="44" fill="#0a0a0a"/>
  <rect x="0" y="586" width="1200" height="2" fill="#dc2626"/>
  <text x="80" y="615" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#a3a3a3" letter-spacing="2">24/7  ·  FULLY INSURED  ·  ALL OF GREATER MANCHESTER  ·  AVG 24-MIN RESPONSE</text>
</svg>

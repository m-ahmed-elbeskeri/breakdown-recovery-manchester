<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Recovery Mayt. 24/7 breakdown recovery in Manchester. 24-minute response. Call 0161 000 0000.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d2038"/>
      <stop offset="100%" stop-color="#081525"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- hi-vis rule, top and bottom -->
  <rect x="0" y="0" width="1200" height="10" fill="#f5c518"/>

  <!-- lockup: mark + wordmark -->
  <g transform="translate(80,52) scale(1.35)">
    <circle cx="24" cy="24" r="22" fill="#f5c518"/>
    <circle cx="24" cy="24" r="22" fill="none" stroke="#0e151d" stroke-width="3"/>
    <circle cx="17" cy="19.5" r="2.6" fill="#0e151d"/>
    <circle cx="31" cy="19.5" r="2.6" fill="#0e151d"/>
    <path d="M14.5 27.5 C 17.5 34.5, 27.5 35.5, 31.5 29.5 C 33.2 26.8, 30.2 25.2, 29.8 28.4"
          fill="none" stroke="#0e151d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="'Anton', 'Arial Narrow', Impact, sans-serif" font-weight="900">
    <text x="168" y="100" font-size="40" fill="#ffffff" letter-spacing="1">RECOVERY <tspan fill="#f5c518">MAYT</tspan></text>
  </g>

  <!-- headline -->
  <g font-family="'Anton', 'Arial Narrow', Impact, sans-serif" font-weight="900">
    <text x="80" y="290" font-size="92" fill="#ffffff" letter-spacing="-1">BREAKDOWN</text>
    <text x="80" y="382" font-size="92" fill="#ffffff" letter-spacing="-1">RECOVERY</text>
    <rect x="72" y="404" width="452" height="96" fill="#f5c518"/>
    <text x="80" y="478" font-size="92" fill="#0e151d" letter-spacing="-1">MANCHESTER.</text>
  </g>

  <!-- stats card -->
  <g transform="translate(830, 190)">
    <rect x="0" y="0" width="290" height="270" fill="#143050" stroke="#f5c518" stroke-width="4"/>
    <text x="145" y="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="14" fill="#d8e6f5" letter-spacing="4">AVG RESPONSE</text>
    <text x="145" y="146" text-anchor="middle" font-family="'Anton', Impact, sans-serif" font-weight="900" font-size="104" fill="#f5c518">24</text>
    <text x="145" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#85aeda" letter-spacing="2">MINUTES</text>
    <line x1="40" y1="200" x2="250" y2="200" stroke="#1b4069" stroke-width="2"/>
    <text x="145" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="12" fill="#d8e6f5" letter-spacing="3">CALL NOW</text>
    <text x="145" y="258" text-anchor="middle" font-family="'Anton', Impact, sans-serif" font-weight="900" font-size="26" fill="#ffffff" letter-spacing="1">0161 000 0000</text>
  </g>

  <!-- byline -->
  <rect x="0" y="578" width="1200" height="52" fill="#081525"/>
  <rect x="0" y="578" width="1200" height="3" fill="#f5c518"/>
  <text x="80" y="611" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#85aeda" letter-spacing="2">24/7  ·  FULLY INSURED  ·  ALL OF GREATER MANCHESTER  ·  FROM £40</text>
</svg>
